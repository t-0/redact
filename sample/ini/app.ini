; INI sample
; semicolon and hash both start a comment
# both forms appear below

[general]
name = redact
version = 0.1.0
debug = false

[paths]
config = ~/.redact.toml
log = /var/log/redact.log

[editor]
tab_width=4
trim_trailing_whitespace = true
rulers = 80,100

[keys]
preview = ctrl+k v
problems = ctrl+k e
